{% extends 'base.html' %}

{% block title %} Студенты {% endblock %}

{% block content1_head %}
    <h1>Студенты</h1>
{% endblock %}

{% block content1 %}
<div class="container_tab">
<table class="journal-table grades-table">
    
    {% for s in students %}
    <tr>
        <td>
        <a href="{% url 'student_detail' s.id %}"> {{s.surname}} {{s.name}}</a>
        </td>
    </tr>
    {% endfor %}
    
</table>
</div>
{% endblock %}
